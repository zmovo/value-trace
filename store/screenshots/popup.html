<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ValueTrace screenshot — start</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #0f172a;
        color: #e2e8f0;
        font: 16px/1.5 Arial, Helvetica, sans-serif;
      }
      main {
        padding: 72px 64px 0;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: #8ab4f8;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 36px;
      }
      .hint {
        color: #94a3b8;
        max-width: 640px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin: 32px 0 0;
        width: 920px;
      }
      .dash {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 20px;
      }
      .label {
        color: #94a3b8;
        font-size: 14px;
      }
      .value {
        margin-top: 8px;
        font-size: 32px;
        font-weight: 700;
      }
      .chrome {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        background: #202124;
        border-bottom: 1px solid #3c4043;
        display: flex;
        align-items: center;
        padding: 0 16px 0 20px;
        box-sizing: border-box;
        font: 12px/1 Arial, Helvetica, sans-serif;
        color: #9aa0a6;
      }
      .omnibox {
        margin-left: 24px;
        flex: 1;
        max-width: 640px;
        background: #3c4043;
        color: #e8eaed;
        border-radius: 16px;
        padding: 7px 14px;
      }
      .toolbar-icon {
        margin-left: auto;
        width: 22px;
        height: 22px;
        border-radius: 5px;
        background: #1a73e8;
        box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.45);
      }
      .popup {
        position: absolute;
        top: 48px;
        right: 24px;
        box-sizing: border-box;
        width: 380px;
        padding: 22px 22px 18px;
        background: #1b1e24;
        color: #f4f6f8;
        font: 14px/1.4 "Segoe UI", Arial, sans-serif;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #1a73e8;
        color: #fff;
        font: 700 26px/44px Arial, sans-serif;
        text-align: center;
        flex: none;
      }
      .popup h2 {
        margin: 0;
        flex: 1;
        font-size: 22px;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      .tagline {
        margin: 18px 0;
        color: #a4aab4;
        font-size: 16px;
        font-weight: 500;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 12px 5px 9px;
        border-radius: 999px;
        background: rgba(46, 160, 80, 0.18);
        font-size: 13px;
        font-weight: 650;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3ddc84;
        box-shadow: 0 0 0 3px rgba(61, 220, 132, 0.18);
      }
      #start {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 14px 16px;
        background: #1e7dff;
        color: #fff;
        font: 700 18px/1.2 "Segoe UI", Arial, sans-serif;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 16px 0 0;
        color: #9aa1ab;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="chrome">
      <span>New tab</span>
      <div class="omnibox">https://zmovo.github.io/value-trace/</div>
      <div class="toolbar-icon" aria-hidden="true"></div>
    </div>
    <main>
      <p class="eyebrow">ValueTrace public demo</p>
      <h1>Venue Dashboard</h1>
      <p class="hint">1. Start Inspect &nbsp; 2. Click a number</p>
      <section class="grid">
        <article class="dash">
          <div class="label">Entry Guests</div>
          <div class="value">66,860</div>
        </article>
        <article class="dash">
          <div class="label">Exit Guests</div>
          <div class="value">52,113</div>
        </article>
        <article class="dash">
          <div class="label">Occupancy</div>
          <div class="value">63.2%</div>
        </article>
        <article class="dash">
          <div class="label">Queue</div>
          <div class="value">27 min</div>
        </article>
      </section>
    </main>
    <div class="popup">
      <div class="top">
        <div class="logo">V</div>
        <h2>ValueTrace</h2>
        <div class="pill"><span class="dot"></span>Ready</div>
      </div>
      <p class="tagline">Trace a number to its API source.</p>
      <button id="start" type="button">Start Inspect</button>
      <div class="foot">Then click a number on the page</div>
    </div>
  </body>
</html>
