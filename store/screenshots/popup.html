<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ValueTrace screenshot — start</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #0f172a;
        color: #e2e8f0;
        font: 16px/1.5 Arial, Helvetica, sans-serif;
      }
      main {
        padding: 72px 64px 0;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: #8ab4f8;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 36px;
      }
      .hint {
        color: #94a3b8;
        max-width: 640px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin: 32px 0 0;
        width: 920px;
      }
      .dash {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 20px;
      }
      .label {
        color: #94a3b8;
        font-size: 14px;
      }
      .value {
        margin-top: 8px;
        font-size: 32px;
        font-weight: 700;
      }
      .chrome {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        background: #202124;
        border-bottom: 1px solid #3c4043;
        display: flex;
        align-items: center;
        padding: 0 16px 0 20px;
        box-sizing: border-box;
        font: 12px/1 Arial, Helvetica, sans-serif;
        color: #9aa0a6;
      }
      .omnibox {
        margin-left: 24px;
        flex: 1;
        max-width: 640px;
        background: #3c4043;
        color: #e8eaed;
        border-radius: 16px;
        padding: 7px 14px;
      }
      .toolbar-icon {
        margin-left: auto;
        width: 22px;
        height: 22px;
        border-radius: 5px;
        background: #1a73e8;
        box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.45);
      }
      .popup {
        position: absolute;
        top: 48px;
        right: 24px;
        width: 260px;
        padding: 12px;
        background: #202124;
        color: #e8eaed;
        font: 12px/1.45 Arial, Helvetica, sans-serif;
        border-radius: 8px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        border: 1px solid #3c4043;
      }
      .popup h2 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      .popup p,
      .popup .status {
        margin: 0 0 10px;
        color: #9aa0a6;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .actions button {
        flex: 1;
        border: 0;
        border-radius: 6px;
        padding: 7px 8px;
        font-weight: 600;
      }
      #start {
        background: #8ab4f8;
        color: #202124;
      }
      #stop {
        background: #5f6368;
        color: #e8eaed;
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <div class="chrome">
      <span>New tab</span>
      <div class="omnibox">https://zmovo.github.io/value-trace/</div>
      <div class="toolbar-icon" aria-hidden="true"></div>
    </div>
    <main>
      <p class="eyebrow">ValueTrace public demo</p>
      <h1>Venue Dashboard</h1>
      <p class="hint">1. Start Inspect &nbsp; 2. Click a number</p>
      <section class="grid">
        <article class="dash">
          <div class="label">Entry Guests</div>
          <div class="value">66,860</div>
        </article>
        <article class="dash">
          <div class="label">Exit Guests</div>
          <div class="value">52,113</div>
        </article>
        <article class="dash">
          <div class="label">Occupancy</div>
          <div class="value">63.2%</div>
        </article>
        <article class="dash">
          <div class="label">Queue</div>
          <div class="value">27 min</div>
        </article>
      </section>
    </main>
    <div class="popup">
      <h2>ValueTrace</h2>
      <p>1. Start Inspect &nbsp; 2. Click a number</p>
      <div class="status">Start Inspect, then click a number.</div>
      <div class="actions">
        <button id="start" type="button">Start Inspect</button>
        <button id="stop" type="button">Stop Inspect</button>
      </div>
    </div>
  </body>
</html>
