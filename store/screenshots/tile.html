<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ValueTrace small tile</title>
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: #0f172a;
        color: #e8eaed;
        font: 16px/1.35 Arial, Helvetica, sans-serif;
      }
      body {
        padding: 28px 28px 24px;
        box-sizing: border-box;
      }
      .mark {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: #1a73e8;
        color: #fff;
        font: 700 26px/40px Arial, Helvetica, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: #9aa0a6;
        max-width: 360px;
      }
    </style>
  </head>
  <body>
    <div class="mark">V</div>
    <h1>ValueTrace</h1>
    <p>See which API a number comes from. Click a number to start.</p>
  </body>
</html>
