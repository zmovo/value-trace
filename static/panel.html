<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>API Source</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <strong>ValueTrace</strong>
        <span>Optional JSON view. Inspect starts from the toolbar icon.</span>
      </div>
      <div class="actions">
        <button id="start" type="button">Start Inspect</button>
        <button id="stop" type="button" disabled>Stop Inspect</button>
      </div>
    </header>
    <div id="status" class="status">Waiting for this page’s APIs…</div>
    <div id="empty" class="empty">
      Click a match on the page to open the full JSON here.
    </div>
    <div id="detail" class="detail" hidden>
      <section>
        <h2>Request</h2>
        <div class="request-line">
          <span id="method" class="method"></span>
          <span id="url" class="url"></span>
        </div>
        <div id="meta" class="meta"></div>
        <button id="open-network" type="button">Open in Network</button>
      </section>
      <section>
        <h2>JSON Path</h2>
        <div id="path" class="path"></div>
      </section>
      <section>
        <h2>Response</h2>
        <pre id="json" class="json"></pre>
      </section>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
