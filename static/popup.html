<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ValueTrace</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img src="icons/icon128.png" width="44" height="44" alt="" />
      <h1>ValueTrace</h1>
      <div id="status" class="pill" data-mode="ready">
        <span class="dot"></span>
        <span id="status-label">Ready</span>
      </div>
    </header>
    <p class="tagline">Trace a number to its API source.</p>
    <button id="action" type="button" data-action="start">Start Inspect</button>
    <p id="hint" class="hint">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M6 3.5 6 16.5 9.2 13.4 12.2 19.2 14.4 18.2 11.4 12.4 16.2 12.2Z" fill="currentColor" />
      </svg>
      <span id="hint-label">Then click a number on the page</span>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
